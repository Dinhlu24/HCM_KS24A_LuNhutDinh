<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css
    "
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="container">
      <h1>Quản Lý Sinh Viên</h1>
      <div class="inputPlace">
        <form onsubmit="addStudent(event)">
          <div class="mb-3">
            <input
              type="text"
              class="form-control"
              name="name"
              placeholder="Họ và tên"
            />
            <div id="nameHelp" class="notify">Họ tên không được để trống</div>
          </div>
          <div class="mb-3">
            <input
              type="text"
              class="form-control"
              name="mssv"
              placeholder="Mã số sinh viên"
            />
            <div id="mssvHelp" class="notify">
              Mã số sinh viên không được để trống
            </div>
          </div>
          <div class="mb-3">
            <input
              type="text"
              class="form-control"
              name="email"
              placeholder="Email"
            />
            <div id="emailHelp" class="notify">Email không hợp lệ</div>
          </div>
          <div class="mb-3">
            <input
              type="text"
              class="form-control"
              name="Class"
              placeholder="Lớp"
            />
            <div id="classHelp" class="notify">Lớp không được để trống</div>
          </div>
          <div class="submitPlace">
            <button type="submit" class="btn btn-primary" id="clickAdd">
              Thêm sinh viên
            </button>
          </div>
        </form>
      </div>
      <div class="renderPlace">
        <input
          class="form-control"
          type="text"
          placeholder="Tìm kiếm theo tên..."
          id="inputFind"
          oninput="searchStudent()"
        />
        <table class="table table-bordered">
          <thead>
            <tr>
              <th scope="col">Họ tên</th>
              <th scope="col">MSSV</th>
              <th scope="col">Email</th>
              <th scope="col">Lớp</th>
              <th scope="col">Hành động</th>
            </tr>
          </thead>
          <tbody id="renderData">
            <!-- <tr>
              <td>Trần Minh Cường</td>
              <td>SV001</td>
              <td>cuongtm@gmail.com</td>
              <td>@HN_ENG_KS24A</td>
              <td>
                <button type="button" class="btn btn-success">Sửa</button>
                <button type="button" class="btn btn-danger">Xóa</button>
              </td>
            </tr> -->
          </tbody>
        </table>
      </div>
    </div>
    <script src="main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js
    "></script>
  </body>
</html>
